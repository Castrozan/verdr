name: Verify

on: push

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Install pinned Codex for native integration
        shell: bash
        run: |
          curl -fsSL --max-time 120 https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-package-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/codex.tar.gz"
          echo "a65b895c6ac1a73629bbe4b864640c86133e94a43b4d67b3103044e1a306d5a2  $RUNNER_TEMP/codex.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/codex"
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP/codex"
          echo "VERDR_CODEX_EXECUTABLE=$RUNNER_TEMP/codex/bin/codex" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Hermes for native integration
        shell: bash
        run: |
          python -m pip install uv==0.9.30
          git init "$RUNNER_TEMP/hermes-source"
          git -C "$RUNNER_TEMP/hermes-source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-source" fetch --depth=1 origin d337b736aa1e8ebecfab043842d13e4a2d2f48a3
          git -C "$RUNNER_TEMP/hermes-source" checkout --detach FETCH_HEAD
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-environment" uv sync --project "$RUNNER_TEMP/hermes-source" --python 3.12 --locked --no-default-groups --extra mcp
          echo "VERDR_HERMES_PYTHON=$RUNNER_TEMP/hermes-environment/bin/python3" >> "$GITHUB_ENV"
      - name: Verify native discovery and skill invocation without model credentials
        run: npm run test:native
      - run: node dist/cli.js run examples/standalone/suite.json --output results/standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-report-node-${{ matrix.node }}
          path: results/standalone
          if-no-files-found: error
